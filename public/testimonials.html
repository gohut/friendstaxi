body{min-height:100vh;font-family:"ClementePDai",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1) 0%,var(--bg1) 62%,var(--bg2) 100%);background-color:var(--bg1)}

.clip{position:absolute;left:50%;width:12px;height:14px;margin-left:-6px;border-radius:4px 4px 6px 6px;background:linear-gradient(#ffe45c,#c9a800);box-shadow:0 1px 2px rgba(0,0,0,.25)}

 return `<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="b${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p.bg[0]}"/><stop offset="1" stop-color="${p.bg[1]}"/></linearGradient><radialGradient id="h${id}" cx=".4" cy=".32" r=".85"><stop offset="0" stop-color="${p.L}"/><stop offset=".6" stop-color="${p.S}"/><stop offset="1" stop-color="${p.D}"/></radialGradient></defs>
 <rect width="200" height="200" fill="url(#b${id})"/>${back}
 <path d="M84 120h32l4 30q0 22-20 24-20-2-20-24z" fill="${p.D}"/>${garm}${k==="lakshmi"?braid:""}
 <ellipse cx="100" cy="150" rx="26" ry="7" fill="rgba(0,0,0,.14)"/>
 <ellipse cx="58.5" cy="98" rx="7" ry="11" fill="${p.S}"/><ellipse cx="141.5" cy="98" rx="7" ry="11" fill="${p.S}"/>${ear}
 <path d="M100 38C128 38 144 62 144 92 144 124 126 148 100 148S56 124 56 92C56 62 72 38 100 38Z" fill="url(#h${id})"/>
 <ellipse cx="73" cy="113" rx="9" ry="6" fill="#e0705e" opacity=".2"/><ellipse cx="127" cy="113" rx="9" ry="6" fill="#e0705e" opacity=".2"/>
 ${hair}${extra}
 ${eye(80,-1,f)}${eye(120,1,f)}
 <path d="M67 82Q78 73.5 93 79M107 79Q122 73.5 133 82" stroke="${HR}" stroke-width="${bw}" fill="none" stroke-linecap="round"/>
 <path d="M100 98C98 106 96 112 94 115 97 119 103 119 106 115" stroke="${p.D}" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/>
 ${k==="karthik"?`<path d="${beard}" fill="${HR}"/>`:k==="arjun"?`<path d="${beard}" fill="${HR}" opacity=".15"/>`:""}
 <path d="M88 127Q94 122.5 100 125 106 122.5 112 127Q100 137 88 127Z" fill="${p.lip}"/><path d="M88 127Q100 130.5 112 127" stroke="rgba(0,0,0,.28)" stroke-width="1" fill="none"/><ellipse cx="100" cy="131.5" rx="5" ry="1.5" fill="#fff" opacity=".22"/>
 ${k==="arjun"||k==="karthik"||k==="senthil"?`<path d="M83 125Q92 115 100 120Q108 115 117 125Q108 121.5 100 124.5Q92 121.5 83 125Z" fill="${HR}"/>`:""}
 ${k==="karthik"||p.g?`<g stroke="#26262c" stroke-width="2.4" fill="rgba(255,255,255,.1)"><circle cx="80" cy="95" r="14"/><circle cx="120" cy="95" r="14"/></g><path d="M94 93Q100 90 106 93M66 93L56 90M134 93L144 90" stroke="#26262c" stroke-width="2.2" fill="none" stroke-linecap="round"/>`:""}
 </svg>`;
}
const stage=document.getElementById("stage"),vp=document.getElementById("vp"),count=document.getElementById("count");
const mq=matchMedia("(max-width:699px)"),N=PEOPLE.length;
const rots=[[-2.2,-.8],[1.2,2.4],[-1.2,.4],[.6,2]],yOff=[18,52,34,70],STAR="★★★★★";
let idx=0,mode=null,hangs=[],pathEl=null,geo={pitch:0},uid=0;
function makeCard(p,i){
 if(language==="ta"){p={...p,...TA_PEOPLE[i]};}
 const h=document.createElement("div");h.className="hang";
 const r=rots[i%4];
 h.style.setProperty("--r0",r[0]+"deg");h.style.setProperty("--r1",r[1]+"deg");
 h.style.animationDelay=(-i*1.3)+"s";
 const num=String(i+1).padStart(2,"0");
 h.innerHTML=`<div class="string"></div><div class="clip"></div>
 <div class="tilt"><div class="card"><div class="flip">
  <div class="face front"><div class="meta"><span>${UI[language].testimonial}</span><span>#${num}</span></div>
   <div class="photo">${avatar(p,"a"+uid++)}</div>
   <div class="name">${p.n}</div><div class="stars" aria-label="5 out of 5 stars">${STAR}<em>5.0</em></div>
   <div class="cta"><span>${UI[language].read}</span><i>↻</i></div></div>
  <div class="face back"><div class="meta"><span>${UI[language].testimonial} / ${num}</span><span>❝</span></div>
   <div class="who"><div class="av">${avatar(p,"a"+uid++)}</div><div><b>${p.n}</b><small>${p.loc}</small></div></div>
   <div class="bstars">${STAR}</div>
   <div class="quote">“${p.q}”</div>
   <div class="bottom"><span>${UI[language].verified}</span><span>${p.loc.split(",")[0]}</span></div></div>
 </div></div></div>`;
 const card=h.querySelector(".card"),tilt=h.querySelector(".tilt"),back=h.querySelector(".back");
 card.addEventListener("click",()=>card.classList.toggle("flipped"));
 card.addEventListener("pointermove",e=>{
  const rc=card.getBoundingClientRect(),x=(e.clientX-rc.left)/rc.width,y=(e.clientY-rc.top)/rc.height;
  back.style.setProperty("--mx",(x*100)+"%");back.style.setProperty("--my",(y*100)+"%");
  if(e.pointerType==="mouse")tilt.style.transform=`rotateY(${(x-.5)*10}deg) rotateX(${(.5-y)*8}deg)`;
 });
 card.addEventListener("pointerleave",()=>{tilt.style.transform=""});
 return h;
}
function updateCount(){if(count)count.textContent=String(idx+1).padStart(2,"0")+" / "+String(N).padStart(2,"0")+" · "+UI[language].swipe}
function build(){
 const mob=mq.matches;mode=mob;vp.innerHTML="";hangs=[];
 if(mob){
  [N-1,...PEOPLE.keys(),0].forEach(i=>{
   const s=document.createElement("div");s.className="slot";s.innerHTML='<div class="slotwire"></div>';
   const h=makeCard(PEOPLE[i],i);s.appendChild(h);hangs.push(h);vp.appendChild(s);
  });
 }else{
  vp.innerHTML='<svg class="wire"><path id="wirePath"/></svg>';pathEl=vp.querySelector("#wirePath");
  PEOPLE.forEach((p,i)=>{const h=makeCard(p,i);vp.appendChild(h);hangs.push(h)});
 }
 layout();
}
function show(instant){
 hangs.forEach((h,i)=>{
  let rel=((i-idx)%N+N)%N;if(rel===N-1)rel=-1;
  const jump=instant||h._rel===undefined||Math.abs(rel-h._rel)>1;
  if(jump)h.style.transition="none";
  h.style.translate=(rel*geo.pitch)+"px 0";
  if(jump){void h.offsetWidth;h.style.transition=""}
  h._rel=rel;
  if(rel<0||rel>3)h.querySelector(".card").classList.remove("flipped");
 });
 updateCount();
}
function layout(){
 if(mq.matches!==mode){build();return}
 const mob=mode,W=vp.clientWidth,wy=30;
 const cw=mob?Math.min(260,W-56):Math.min(210,(W-24)/4.25),u=cw/20,gap=mob?(W-cw)/2:(W-4*cw)/5;
 geo.pitch=cw+gap;
 hangs.forEach((h,i)=>{
  const li=mob?(i===0?N-1:i===N+1?0:i-1):i,off=mob?30:yOff[li%4];
  h.style.left=gap+"px";h.style.top=wy+"px";h.style.width=cw+"px";
  h.querySelector(".card").style.setProperty("--u",u);
  h.querySelector(".string").style.height=(off+10)+"px";
  h.querySelector(".clip").style.top=(off-2)+"px";
  h.querySelector(".tilt").style.top=(off+10)+"px";
 });
 stage.style.minHeight=(cw*1.3+(mob?30:70)+80)+"px";
 if(mob){vp.style.scrollSnapType="none";vp.scrollLeft=(idx+1)*W;requestAnimationFrame(()=>vp.style.scrollSnapType="");updateCount()}
 else{pathEl.setAttribute("d",`M0 ${wy} L${W} ${wy}`);show(true)}
}
function go(d){if(mq.matches)return;idx=((idx+d)%N+N)%N;show()}
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
let st;
vp.addEventListener("scroll",()=>{
 if(!mq.matches)return;
 const W=vp.clientWidth,cur=Math.round(vp.scrollLeft/W);
 idx=((cur-1)%N+N)%N;updateCount();
 clearTimeout(st);
 st=setTimeout(()=>{
  let c=Math.round(vp.scrollLeft/W);
  if(c===0||c===N+1){c=c===0?N:1;vp.style.scrollSnapType="none";vp.scrollLeft=c*W;requestAnimationFrame(()=>vp.style.scrollSnapType="")}
  idx=((c-1)%N+N)%N;updateCount();
  hangs.forEach((h,k)=>{if(k!==c)h.querySelector(".card").classList.remove("flipped")});
 },90);
},{passive:true});
function setLanguage(next){
 if(next!=="ta"&&next!=="en")return;
 if(language===next&&document.documentElement.lang===next)return;
 language=next;document.documentElement.lang=next;
 const labels=UI[next],heading=document.querySelector("h1"),side=document.querySelector(".head .side");
 heading.childNodes[0].textContent=labels.heading;heading.querySelector("span").textContent=labels.sub;side.textContent=labels.side;
 document.getElementById("prev").setAttribute("aria-label",labels.previous);document.getElementById("next").setAttribute("aria-label",labels.next);
 build();
}
window.addEventListener("message",e=>{if(e.data?.type==="friends-taxi-language")setLanguage(e.data.lang)});
build();addEventListener("resize",layout);
let autoFlipTimer=null,autoFlipStep=0;
addEventListener("message",e=>{
 if(e.data?.type!=="testimonial-visibility")return;
 if(!e.data.visible){clearInterval(autoFlipTimer);autoFlipTimer=null;autoFlipStep=0;hangs.forEach(h=>h.querySelector(".card").classList.remove("flipped"));return}
 if(autoFlipTimer)return;
 autoFlipTimer=setInterval(()=>{
  const visible=mode
   ? [hangs[Math.round(vp.scrollLeft/Math.max(vp.clientWidth,1))]].filter(Boolean)
   : hangs.filter(h=>h._rel>=0&&h._rel<=3).sort((a,b)=>a._rel-b._rel);
  if(!visible.length)return;
  hangs.forEach(h=>h.querySelector(".card").classList.remove("flipped"));
  visible[autoFlipStep%visible.length].querySelector(".card").classList.add("flipped");
  autoFlipStep++;
 },3000);
});
</script>
</body>
</html>
