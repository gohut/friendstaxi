<style>
:root{--bg:#f4f6fb;--fg:#1a2a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--fg:#e8ecf8}}
:root[data-theme="dark"]{--bg:#0e1220;--fg:#e8ecf8}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center}
.wrap{text-align:center;padding:16px}
svg{width:min(56vw,38vh,440px);height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,40,.35));animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.fb{transform-box:fill-box;transform-origin:center}
.orbit{animation:spin 1.6s linear infinite}
.orbit2{animation:spin 2.6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 2s ease-out infinite}
.ripple.r2{animation-delay:1s}
@keyframes ripple{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.07);opacity:0}}
.st{animation:slideR 1.4s linear infinite}
.sb{animation:slideL 1.45s linear infinite}
@keyframes slideR{to{transform:translateX(28px)}}
@keyframes slideL{to{transform:translateX(-29px)}}
.sweep{animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-260px)}60%,100%{transform:translateX(760px)}}
.txt{margin:6px 0 0;font-weight:700;letter-spacing:.18em;font-size:15px;text-transform:uppercase;opacity:.85}
.txt i{font-style:normal;animation:dot 1.2s infinite both}
.txt i:nth-child(2){animation-delay:.2s}.txt i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.15}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
p{margin:12px 0 0;opacity:.7;font-size:14px}
</style>
